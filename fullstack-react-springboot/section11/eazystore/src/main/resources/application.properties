spring.application.name=eazystore

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

logging.level.root=${LOG_LEVEL:INFO}
#laptop
logging.file.name=${LOG_FILE_NAME:C:/Users/berto/Documents/Workspaces/react_tutorial/logs/app.log} 
#desktop
#logging.file.name=${LOG_FILE_NAME:C:/Users/berto/Documents/react-apps/react-tutorial-studio-state/react_tutorial/logs/app.log}
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazystore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

management.endpoint.health.show-details=always

management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.name=eazystore or ${spring.application.name}
info.app.description=Backend Project for Eazy Strore E-commerce application
info.app.version=1.0.0
info.app.contact.email=berlfa@gmail.com